name: Daily Fact

# ОТКЛЮЧЕНО ВРЕМЕННО — только ручной запуск через workflow_dispatch.
# Чтобы вернуть автоматическую публикацию, раскомментируй блок schedule
# и выбери удобное время. Например:
#   - cron: "0 12 * * 0,2,3,4,5,6"   # вт-вс 15:00 МСК
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tarot-daily-fact
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Post daily fact
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot/daily_fact.py

      - name: Commit updated history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet bot/history.json; then
            echo "history.json не изменился — коммит не нужен"
          else
            git add bot/history.json
            git commit -m "chore: daily fact history $(date -u +'%Y-%m-%d')"
            git push
          fi
