name: Generate Themed Bank

# 1-го числа каждого месяца в 03:00 UTC = 06:00 МСК
# Запускаем рано, чтобы было время на повторный запуск если упадёт
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tarot-themed-bank
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # ~16 мин нормальный прогон + запас на rate limits

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Глубина 0 нужна чтобы git push мог выполняться корректно изнутри
          # скрипта (он коммитит каждые 5 карт чтобы не терять прогресс при
          # таймауте 60 минут).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Generate themed bank
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # Скрипт сам коммитит и пушит каждые 5 карт.
        # Это гарантирует что прогресс попадёт в репо даже если workflow
        # будет убит по таймауту 60 минут — что часто случается из-за
        # rate limits Groq на бесплатном тарифе.
        run: python bot/generate_themed.py
